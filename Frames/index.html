<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Italia - Restaurant & Bistro</title>
    <style>
        :root {
            --primary-color: #8b0000;
            --accent-color: #d4af37;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Frame */
        header {
            background-color: #0a0a0a;
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 45px;
            height: 45px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .audio-player span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Main Container with Frames */
        .layout-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 80px);
        }

        /* Left Sidebar Frame */
        nav {
            width: 260px;
            background-color: #161616;
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--accent-color);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-list li a {
            color: var(--text-light);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            display: block;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.02);
            font-size: 0.95rem;
        }

        .nav-list li a:hover, .nav-list li a.active {
            background-color: var(--primary-color);
            color: #ffffff;
            padding-left: 18px;
        }

        .info-box {
            margin-top: auto;
            background: #222;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border-left: 3px solid var(--accent-color);
        }

        /* Main Display Frame */
        main {
            flex: 1;
            background-color: var(--bg-dark);
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

            order: `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { font-family: sans-serif; padding: 25px; color: #f5f5f5; background: #121212; }
                        h2 { color: #d4af37; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 8px; }
                        .form-group { margin-bottom: 15px; }
                        label { display: block; margin-bottom: 5px; font-weight: bold; }
                        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1e1e1e; color: #fff; box-sizing: border-box; }
                        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
                        .checkbox-group input { width: auto; }
                        button { background: #8b0000; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; }
                        button:hover { background: #a00000; }
                        .total-card { background: #1e1e1e; border: 1px solid #d4af37; padding: 15px; border-radius: 6px; margin-top: 15px; }
                    </style>
                </head>
                <body>
                    <h2>🛒 Online Order Form</h2>
                    <form id="orderForm" onsubmit="event.preventDefault(); alert('Order placed successfully!');">
                        <div class="form-group">
                            <label for="custName">Customer Name:</label>
                            <input type="text" id="custName" required placeholder="John Doe">
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" required placeholder="(555) 000-0000">
                        </div>

                        <div class="form-group">
                            <label>Select Items:</label>
                            <div class="checkbox-group">
                                <input type="checkbox" class="item-check" data-price="9.50" id="item1" onchange="calcTotal()">
                                <label for="item1">Bruschetta Classica ($9.50)</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" class="item-check" data-price="18.50" id="item2" onchange="calcTotal()">
                                <label for="item2">Spaghetti Carbonara ($18.50)</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" class="item-check" data-price="16.00" id="item3" onchange="calcTotal()">
                                <label for="item3">Pizza Margherita ($16.00)</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" class="item-check" data-price="8.50" id="item4" onchange="calcTotal()">
                                <label for="item4">Classic Tiramisu ($8.50)</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Special Requests / Dietary Notes:</label>
                            <textarea id="notes" rows="3" placeholder="Extra cheese, gluten-free crust, etc."></textarea>
                        </div>

                        <div class="total-card">
                            <h3>Total Amount: <span id="total-display" style="color: #d4af37;">$0.00</span></h3>
                        </div>
                        <br>
                        <button type="submit">Confirm & Place Order</button>
                    </form>

                    <script>
                        function calcTotal() {
                            let total = 0;
                            const checkboxes = document.querySelectorAll('.item-check');
                            checkboxes.forEach(cb => {
                                if(cb.checked) {
                                    total += parseFloat(cb.getAttribute('data-price'));
                                }
                            });
                            document.getElementById('total-display').innerText = '$' + total.toFixed(2);
                        }
                    <\/script>
                </body>
                </html>

        // JavaScript function to manipulate dynamic frame content
        function loadContent(pageKey) {
            const frame = document.getElementById('main-frame');
            if (pages[pageKey]) {
                frame.srcdoc = pages[pageKey];
            }

            // Update active state in sidebar
            const links = document.querySelectorAll('.nav-link');
            links.forEach(link => link.classList.remove('active'));
            event.target.classList.add('active');
        }
