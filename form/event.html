<!DOCTYPE html>
<html>
<head>
<title>Event Registration Form</title>
</head>

<body bgcolor="#E6F7FF">

<center>
<h1><font color="darkblue">EVENT REGISTRATION FORM</font></h1>
<hr width="60%">

<form>

<table border="1" cellpadding="10" bgcolor="white">

<tr>
<td><b>Full Name</b></td>
<td><input type="text" name="name" placeholder="Enter your name"></td>
</tr>

<tr>
<td><b>Register Number</b></td>
<td><input type="text" name="regno" placeholder="Enter register number"></td>
</tr>

<tr>
<td><b>Email ID</b></td>
<td><input type="email" name="email" placeholder="Enter email"></td>
</tr>

<tr>
<td><b>Phone Number</b></td>
<td><input type="tel" name="phone" placeholder="Enter phone number"></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td><b>Department</b></td>
<td>
<select>
<option>Select Department</option>
<option>B.Sc Computer Science</option>
<option>BCA</option>
<option>B.Com</option>
<option>BBA</option>
<option>MCA</option>
</select>
</td>
</tr>

<tr>
<td><b>Year</b></td>
<td>
<select>
<option>Select Year</option>
<option>I Year</option>
<option>II Year</option>
<option>III Year</option>
</select>
</td>
</tr>

<tr>
<td><b>Event</b></td>
<td>
<select>
<option>Select Event</option>
<option>Paper Presentation</option>
<option>Quiz</option>
<option>Debugging</option>
<option>Web Designing</option>
<option>Photography</option>
</select>
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td><input type="date"></td>
</tr>

<tr>
<td><b>Address</b></td>
<td><textarea rows="4" cols="25"></textarea></td>
</tr>

<tr>
<td><b>Upload ID Card</b></td>
<td><input type="file"></td>
</tr>

<tr>
<td><b>Food Preference</b></td>
<td>
<input type="checkbox"> Veg
<input type="checkbox"> Non-Veg
</td>
</tr>

<tr>
<td><b>Comments</b></td>
<td><textarea rows="3" cols="25" placeholder="Any suggestions"></textarea></td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>

</center>

</body>
</html>
